# simple_bot scaled to the 30 lb class (user, 2026-10-11: "scale
# simple-bot to each weight class"): fixtures/simple_bot's geometry ×1.375
# about the origin (tools/import/tests/make_fixture.py --scale), with
# 30 lb-class parts on 6S. The scale puts the total at ~97% of
# the class limit, as the 12 lb original is. Materials and tyre grip are
# the original's; see fixtures/simple_bot/robot.toml for why.
#
# Parts (data/motors.toml "Use:" notes): BadAss 2820 1080kv through a
# P60-style 20:1, "30 lb drive through a Banebots P60 or Repeat Magnum";
# Flipsky 6374 190kv, the Discord "30 lb weapon", belted 2:1 up (ratio
# 0.5). 6S. Masses: a 6S 3000 mAh pack ~480 g, two 12 lb-class ESCs
# ~250 g, each motor plus P60 ~420 g (estimates).
#
# The disc runs at 8,400 rpm (belted 2:1 up), under the ~10,000 rpm the
# sim's 2 kHz step holds (lesson rapier-fast-weapon-needs-small-dt). Its
# heavy disc takes ~7 s to reach speed.

[robot]
name = "simple_bot 30 lb"
up = "+z"
forward = "+x"
battery_v = 22.2

[materials]
default = "al6061"

# Tyres: VytaFlex 40, a Shore 40A cast polyurethane (user, 2026-10-10);
# specific gravity 1.0 (Smooth-On's data sheet).
[[materials.rule]]
parts = ["Wheel"]
density_kg_m3 = 1000

[[materials.rule]]
parts = ["Fork", "rear_bar", "weapon"]
material = "ar500"

[[materials.rule]]
parts = ["top_plate"]
material = "uhmw"

[mass_overrides]
"battery" = 0.48
"esc" = 0.25
"DriveMotor" = 0.42

[[wheel]]
name = "wheel_left"
parts = ["wheel_L"]
motor = "badass-2820-1080kv"
ratio = 20.0
mu = 1.4

[[wheel]]
name = "wheel_right"
parts = ["wheel_R"]
motor = "badass-2820-1080kv"
ratio = 20.0
mu = 1.4

[[weapon]]
name = "disc"
parts = ["weapon"]
motor = "flipsky-6374-190kv"
ratio = 0.5
# Front edge up, as a vertical spinner runs: hits throw the opponent up.
# The other way threw this robot into the air on every hit (2026-10-10).
spin = "front-up"

[control]
kind = "mixer"
throttle = 2
turn = 1
weapon = 3
arm = 5
