<!doctype html>
<!-- drivesim's page shell (docs/drivesim.md §8). Open with ?robot=<id>
     (from drivesim-server) or ?bundle=<url>&motors=<url> (a static
     bundle). make web-build copies this next to the wasm. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>drivesim</title>
<style>
  html, body { margin: 0; height: 100%; background: #121214; overflow: hidden; }
  #drivesim { width: 100%; height: 100%; display: block; outline: none; }
  #msg { position: absolute; top: 45%; width: 100%; text-align: center;
         color: #ccc; font: 16px system-ui, sans-serif; }
  #opponent { position: absolute; top: 12px; right: 12px; display: flex; align-items: center;
              gap: 8px; font: 14px system-ui, sans-serif; color: #eee; }
  #opponent[hidden] { display: none; }
  #opponent .seg { display: flex; border: 1px solid #f27314; border-radius: 6px; overflow: hidden; }
  #opponent button { padding: 6px 14px; border: 0; background: rgba(30, 30, 34, 0.85);
                     color: #eee; font: inherit; cursor: pointer; }
  #opponent button + button { border-left: 1px solid #f27314; }
  #opponent button:hover { background: rgba(60, 40, 25, 0.9); }
  #opponent button[aria-pressed="true"] { background: #f27314; color: #121214; font-weight: 600; }
  #rival { padding: 5px 8px; border: 1px solid #f27314; border-radius: 6px; max-width: 14em;
           background: rgba(30, 30, 34, 0.85); color: #eee; font: inherit; }
  #rival[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="drivesim" tabindex="0"></canvas>
<div id="msg">loading drivesim…</div>
<div id="opponent" hidden title="Switch opponent; restarts the round">
  <span>Opponent</span>
  <div class="seg" role="group" aria-label="Opponent">
    <button type="button" data-kind="0" aria-pressed="true">Copy</button>
    <button type="button" data-kind="1" aria-pressed="false">Box</button>
    <button type="button" data-kind="2" aria-pressed="false">AI</button>
  </div>
  <select id="rival" hidden aria-label="Robot the AI drives" title="Robot the AI drives; restarts the round">
    <option value="">Your robot (copy)</option>
  </select>
</div>
<script type="module">
  import init, { set_opponent, set_rival } from "./drivesim_web.js";
  const msg = document.getElementById("msg");
  if (!navigator.gpu) {
    msg.textContent = "This browser has no WebGPU. drivesim needs Chrome or Edge.";
  } else {
    init().catch(e => {
      // winit hands control to the browser by throwing; that one is not an error.
      if (!String(e).includes("Using exceptions for control flow")) { msg.textContent = "drivesim failed: " + e; throw e; }
    });
    // Opponent: three buttons, the chosen one highlighted (user,
    // 2026-10-10): the robot's orange copy (default), an orange box, or
    // the copy driven by the AI. data-kind is what set_opponent takes.
    // Choosing another restarts the round; re-clicking the chosen one does
    // nothing. Focus goes back to the canvas, so a button never keeps the
    // keyboard.
    const canvas = document.getElementById("drivesim"), opp = document.getElementById("opponent");
    const buttons = opp.querySelectorAll("button"), rival = document.getElementById("rival");
    for (const b of buttons) b.addEventListener("click", () => {
      set_opponent(Number(b.dataset.kind));
      for (const o of buttons) o.setAttribute("aria-pressed", String(o === b));
      rival.hidden = b.dataset.kind !== "2";
      canvas.focus();
    });
    // The AI's robot (user, 2026-10-10): its own copy, or any public robot,
    // grouped by weight class with the driven robot's class first. The
    // value is the rival's bundle base URL, what set_rival takes.
    rival.addEventListener("change", () => { set_rival(rival.value); canvas.focus(); });
    fillRivals().catch(e => console.warn("no public robots:", e));
    async function fillRivals() {
      const params = new URLSearchParams(location.search), id = params.get("robot");
      let mine = 0, list;
      if (id) {
        const get = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u + ": HTTP " + r.status); return r.json(); };
        list = (await get("/api/opponents")).filter(o => o.id !== id)
          .map(o => ({ name: o.name + (o.mine ? " (yours)" : ""), lb: o.weight_lb, base: `/api/robots/${o.id}/bundle/` }));
        mine = (await get(`/api/robots/${id}`).catch(() => ({}))).weight_lb || 0;
      } else {
        // A static bundle (make web-dev): the fixture is the one rival there.
        list = [{ name: "simple_bot", lb: 12, base: "/fixtures/simple_bot/" }];
      }
      const classes = [...new Set(list.map(o => o.lb))].sort((a, b) => (b === mine) - (a === mine) || a - b);
      for (const lb of classes) {
        const g = document.createElement("optgroup");
        g.label = lb ? `${lb} lb` : "no class";
        for (const o of list.filter(o => o.lb === lb)) g.append(new Option(o.name, o.base));
        rival.append(g);
      }
    }
    const hide = () => { if (canvas.width > 0) { msg.remove(); opp.hidden = false; } else setTimeout(hide, 200); };
    setTimeout(hide, 500);
  }
</script>
</body>
</html>
