[package]
name = "drivesim-cli"
version = "0.1.0"
edition.workspace = true
description = "drivesim-check: load a robot bundle exactly as the sim does and report it as JSON"

[[bin]]
name = "drivesim-check"
path = "src/main.rs"

[dependencies]
serde_json = "1"
drivesim-robot = { path = "../robot" }
drivesim-physics = { path = "../physics" }
