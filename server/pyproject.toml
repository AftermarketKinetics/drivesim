# drivesim's server: authentik-fronted FastAPI app for robot uploads, the
# sandboxed STEP import and the Claude role conversation (docs/drivesim.md
# §3-4). Its Python packages are managed here by uv (uv.lock); the
# toolchain (python, uv) comes from ../shell.nix.
[project]
name = "drivesim-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "anthropic>=1",
  "httpx",
  "python-multipart",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drivesim_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
