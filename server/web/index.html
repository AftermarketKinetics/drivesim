<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>drivesim</title>
<link rel="stylesheet" href="style.css">
<script src="session.js"></script>
</head>
<body>
<h1>drivesim</h1>
<p class="muted">Drive your combat robot in NHRL's 16 ft cage, from its CAD, with your own radio.</p>

<div id="guide"></div>

<h2>Your robots</h2>
<p id="usage" class="muted"></p>
<p class="muted">Upload a robot as a STEP assembly. It is imported, then Claude asks you a few
questions (which parts are wheels and weapon, materials, motors) and writes its robot file.</p>
<div class="card">
  <input type="file" id="file" accept=".step,.stp,.STEP,.STP">
  <button id="go" disabled>Upload</button>
  <span id="upmsg" class="muted"></span>
</div>
<div id="list"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
async function load() {
  const r = await apiFetch("/api/robots");
  const robots = r.ok ? await r.json() : [];
  $("list").innerHTML = robots.length ? robots.map(b => {
    const state = b.status === "failed" ? `<span class="bad">import failed</span>`
      : b.status === "importing" ? "importing…"
      : b.checked ? `<span class="good">ready to drive</span>` : "needs setting up";
    return `<div class="card"><a href="robot.html?id=${encodeURIComponent(b.id)}">${esc(b.name || "robot")}</a>
      <span class="muted"> · ${new Date(b.created * 1000).toLocaleString()} · </span>${state}</div>`;
  }).join("") : `<p class="muted">No robots yet.</p>`;
}
// Today's Claude usage against the daily budget (driving costs nothing).
async function usage() {
  const r = await apiFetch("/api/usage");
  if (!r.ok) return;
  const u = await r.json();
  const m = n => (n / 1e6).toFixed(1) + " M";
  const out = u.used >= u.budget;
  $("usage").innerHTML = `Claude usage today: ${m(u.used)} of ${m(u.budget)} tokens, ` +
    `resets at midnight Pacific.` + (out ? ` <span class="bad">Used up: new robots and replies ` +
    `wait until then; set-up robots can still be driven.</span>` : "");
}
$("file").onchange = () => { $("go").disabled = !$("file").files.length; };
$("go").onclick = async () => {
  const fd = new FormData();
  fd.append("file", $("file").files[0]);
  $("go").disabled = true;
  $("upmsg").textContent = "uploading…";
  const r = await apiFetch("/api/robots", { method: "POST", body: fd });
  if (!r.ok) { $("upmsg").textContent = (await r.json()).detail || "upload failed"; $("go").disabled = false; return; }
  location.href = "robot.html?id=" + (await r.json()).id;
};
// The guides live in one file, shared with the public landing page.
fetch("/welcome/guide.html").then(r => r.ok ? r.text() : "").then(t => { $("guide").innerHTML = t; });
load();
usage();
</script>
</body>
</html>
