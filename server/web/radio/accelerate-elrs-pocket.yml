# accelerate: an ELRS RadioMaster Pocket model for drivesim (EdgeTX 2.10
# schema, 128x64 B&W). The same sticks and switches drive the sim (USB
# joystick) and a real robot (ELRS):
#   CH1 turn (right stick X)   CH2 throttle (right stick Y)
#   CH3 weapon (left stick Y)  CH5 arm (SA down)
#   spare: CH4 left stick X, CH6 SD, CH7 SE, CH8 SB
# Install: copy to the radio's SD card as MODELS/modelNN.yml in a FREE slot
# NN (copying onto an existing number replaces that model).
semver: 2.10.0
header:
  name: "Accelerate"
# Inputs: the four sticks, no expo or rates (add them on the radio if you
# want them). Sticks are named by role, the form EdgeTX 2.10 writes and
# reads; in Mode 2: Ail = right X, Ele = right Y, Thr = left Y
# (non-centring), Rud = left X.
expoData:
  - srcRaw: Ail
    chn: 0
    mode: 3
    weight: 100
  - srcRaw: Ele
    chn: 1
    mode: 3
    weight: 100
  - srcRaw: Thr
    chn: 2
    mode: 3
    weight: 100
  - srcRaw: Rud
    chn: 3
    mode: 3
    weight: 100
inputNames:
  0:
    val: "Trn"
  1:
    val: "Thr"
  2:
    val: "Wpn"
  3:
    val: "Rud"
# Mixes: destCh is 0-based (0 = CH1). Switches send -100 up, +100 down,
# so arm (SA) is on in the DOWN position.
mixData:
  - destCh: 0
    srcRaw: "I0"
    weight: 100
  - destCh: 1
    srcRaw: "I1"
    weight: 100
  - destCh: 2
    srcRaw: "I2"
    weight: 100
  - destCh: 3
    srcRaw: "I3"
    weight: 100
  - destCh: 4
    srcRaw: "SA"
    weight: 100
  - destCh: 5
    srcRaw: "SD"
    weight: 100
  - destCh: 6
    srcRaw: "SE"
    weight: 100
  - destCh: 7
    srcRaw: "SB"
    weight: 100
limitData:
  0:
    name: "Turn"
  1:
    name: "Thr"
  2:
    name: "Wpn"
  3:
    name: "Rud"
  4:
    name: "Arm"
  5:
    name: "SD"
  6:
    name: "SE"
  7:
    name: "SB"
# Loading the model refuses to start until the arm switch is off (up) and
# the weapon stick is low (throttle warning, on by default).
# 2.10 form: switch letter + u/-/d, only the switches listed are checked.
switchWarningState: Au
# Internal ELRS module: CRSF, 16 channels. ELRS arms from CH5 (AUX1) on its
# own; 2.10 has no crsfArmingMode setting.
moduleData:
  0:
    type: TYPE_CROSSFIRE
    subType: 0
    channelsStart: 0
    channelsCount: 16
    failsafeMode: NOT_SET
  1:
    type: TYPE_NONE
