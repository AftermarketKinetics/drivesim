# The motor library (docs/drivesim.md §5). robot.toml names a motor here
# and may override any number. Units: kv in rpm/V, ohm, A, kg m².
# Every value says where it came from; `provisional` lists placeholders
# that are neither measured nor from a datasheet. Add motors as robots
# need them, with sources.
#
# `kind` is "brushless" (default) or "brushed"; the motor model treats
# both as one DC motor. r_ohm is phase-to-phase for brushless, terminal for
# brushed. A brushed gearmotor's kv is the BARE motor's (output rpm x gear
# ratio / V); its gearbox ratio goes in robot.toml's `ratio`, and `source`
# lists the stock ratios. i_max_a is a motor rating or the ESC limit
# builders run, and `source` says which; brushed entries use stall current.
# rotor_inertia_kg_m2 is the motor's own rotor, without blade or gearbox.
# Sections run by weight class (1, 3, 12, 30 lb); most motors fit a range.
# Library filled from NHRL/HPOD/GSCRL Discord and vendor pages, 2026-10-10.

# --- existing entries (Momentum, 3-12 lb) -----------------------------------

[motor.repeat-ultra-mk2-2830-1450kv]
kv_rpm_per_v = 1450
r_ohm = 0.06
i_max_a = 40
pole_pairs = 7
rotor_inertia_kg_m2 = 5.0e-6
source = "kv: Momentum config.py VITAMIN_MASSES ('2830 1450kv (Repeat)'). r_ohm, i_max_a, pole_pairs: Momentum's 2D sim placeholders (2026-10-09). rotor_inertia: estimate, ~30 g of can at r ~12.5 mm, scaled from Momentum's 2310 estimate (scripts/lifter_motor.py, 3e-6) (2026-10-10). Gearbox (Repeat Ultra Mk2 gearmotor, 170 g): 14:1 drive or 51:1 high reduction, https://repeat-robotics.com/buy/ultra-2/ ; the most-used 12 lb brushless drive (https://discord.com/channels/1003800896033005619/1070177998541688963/1111326784118599700) (2026-10-10)."
provisional = ["r_ohm", "i_max_a", "pole_pairs", "rotor_inertia_kg_m2"]

