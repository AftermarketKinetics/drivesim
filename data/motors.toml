# --- 1 lb (antweight) ------------------------------------------------------
# Repeat, Emax and the 1106 makers publish no winding R or pole count:
# r_ohm is a published 2207 datasheet scaled by kv^2, pole_pairs the usual
# FPV layout, rotor inertia rotating mass x radius^2. Brushed i_max_a is
# stall current; brushless is the ESC limit builders run unless a vendor
# peak exists. NHRL #1lbs: https://discord.com/channels/651601084019900483/810932754979749909/

